[package]
name = "sr-infer-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU inference backend for sr-player: motion-compensated interpolation on Vulkan through the sr_infer ABI"

[lib]
# A loadable plugin *and* a library, so the tests can call the kernels directly
# and compare them with the CPU reference.
crate-type = ["cdylib", "rlib"]

[dependencies]
# WGSL is compiled by naga at runtime, so no external shader compiler or Vulkan
# SDK is needed to build or run this. Vulkan only: DX12 would work, but claiming
# a "Vulkan backend" that silently ran on another API would be a lie in the one
# place this project cannot afford one.
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan"] }
pollster = "0.4"
bytemuck = "1.25.2"

[dev-dependencies]
tempfile = "3"

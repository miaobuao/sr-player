[package]
name = "sr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vendor-neutral media engine: probing, timeline, decode, analysis, restoration pipeline"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
libloading.workspace = true
# Raw Vulkan bindings, used only for the GPU probe. The loader is opened with
# `libloading` at runtime, so a machine without Vulkan simply reports no devices
# instead of failing to start; nothing here is a hard dependency.
ash = { version = "0.38", default-features = false }

[dev-dependencies]
tempfile = "3"
# Built only so the ABI integration test has a real shared library to load.
sr-infer-plugin-example = { path = "../sr-infer-plugin-example" }
# The Vulkan backend is a *test* dependency: the shipped engine has no GPU API
# dependency at all, and `tests/gpu_execution.rs` loads this one as a plugin,
# exactly as a user would.
sr-infer-gpu = { path = "../sr-infer-gpu" }

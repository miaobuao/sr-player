[package]
name = "sr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vendor-neutral media engine: probing, timeline, decode, analysis, restoration pipeline"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
libloading.workspace = true
# Raw Vulkan bindings, used only for the GPU probe. The loader is opened with
# `libloading` at runtime, so a machine without Vulkan simply reports no devices
# instead of failing to start; nothing here is a hard dependency.
ash = { version = "0.38", default-features = false }

[dev-dependencies]
tempfile = "3"
